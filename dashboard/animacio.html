<!-- Animacio del campus hora a hora. El Python substitueix __DADES__ pel JSON de la simulacio. -->
<div id="app">
<style>
  #app{--bg:#0f172a;--card:#111c33;--txt:#e2e8f0;--mut:#94a3b8;--grid:#ef4444;--sol:#facc15;--bat:#2dd4bf;--cam:#60a5fa;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);background:var(--bg);border-radius:14px;padding:14px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .card{background:var(--card);border-radius:12px;padding:10px 14px;flex:1;min-width:120px}
  .lab{font-size:12px;color:var(--mut)} .val{font-size:22px;font-weight:700}
  .ctrl{display:flex;gap:10px;align-items:center;margin:10px 0}
  button{background:#1e293b;color:var(--txt);border:1px solid #334155;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px}
  input[type=range]{flex:1} select{background:#1e293b;color:var(--txt);border:1px solid #334155;border-radius:6px;padding:4px}
  .flow{fill:none;stroke-linecap:round}
  .why{font-size:15px;padding:10px 14px;border-radius:10px;background:#0b1325;border-left:4px solid var(--bat);margin-top:8px}
  text{fill:var(--txt);font-family:inherit}
</style>
<div class="row">
  <div class="card"><div class="lab">Data i hora</div><div class="val" id="k_ts">-</div></div>
  <div class="card"><div class="lab">Preu llum</div><div class="val" id="k_preu">-</div></div>
  <div class="card"><div class="lab">CO₂ de la xarxa</div><div class="val" id="k_co2">-</div></div>
  <div class="card"><div class="lab">CO₂ estalviat (acumulat)</div><div class="val" id="k_sco2" style="color:#4ade80">-</div></div>
  <div class="card"><div class="lab">Diners estalviats (acumulat)</div><div class="val" id="k_seur" style="color:#4ade80">-</div></div>
</div>
<div class="ctrl">
  <button id="play">▶ Play</button>
  <select id="vel"><option value="600">Lent</option><option value="250" selected>Normal</option><option value="80">Ràpid</option><option value="25">Molt ràpid</option></select>
  <input type="range" id="slider" min="0" value="0">
  <span id="pos" class="lab"></span>
</div>
<svg id="diag" viewBox="0 0 900 330" width="100%">
  <defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <path id="f_grid" class="flow" d="M150,165 L430,165"/>
  <path id="f_sol"  class="flow" d="M450,70 L450,150"/>
  <path id="f_bat"  class="flow" d="M450,180 L450,250"/>
  <path id="f_cam"  class="flow" d="M470,165 L740,165"/>
  <circle cx="450" cy="165" r="14" fill="#334155"/>
  <!-- Xarxa -->
  <g transform="translate(40,115)"><rect id="n_grid" width="110" height="100" rx="14" fill="#1e293b" stroke="var(--grid)" stroke-width="3"/>
    <text x="55" y="38" text-anchor="middle" font-size="30">🏭</text><text x="55" y="66" text-anchor="middle" font-size="14">Xarxa</text>
    <text id="t_grid" x="55" y="88" text-anchor="middle" font-size="14" font-weight="700">-</text></g>
  <!-- Solar -->
  <g transform="translate(395,0)"><rect width="110" height="70" rx="14" fill="#1e293b" stroke="var(--sol)" stroke-width="3"/>
    <text x="30" y="44" text-anchor="middle" font-size="26">☀️</text><text x="72" y="30" text-anchor="middle" font-size="13">Solar</text>
    <text id="t_sol" x="72" y="52" text-anchor="middle" font-size="14" font-weight="700">-</text></g>
  <!-- Campus -->
  <g transform="translate(740,115)"><rect width="120" height="100" rx="14" fill="#1e293b" stroke="var(--cam)" stroke-width="3"/>
    <text x="60" y="38" text-anchor="middle" font-size="30">🏫</text><text x="60" y="66" text-anchor="middle" font-size="14">Campus</text>
    <text id="t_cam" x="60" y="88" text-anchor="middle" font-size="14" font-weight="700">-</text></g>
  <!-- Bateria -->
  <g transform="translate(395,250)"><rect width="110" height="72" rx="10" fill="#1e293b" stroke="var(--bat)" stroke-width="3"/>
    <rect x="110" y="26" width="8" height="20" rx="2" fill="var(--bat)"/>
    <rect id="bat_fill" x="5" y="5" width="0" height="62" rx="6" fill="var(--bat)" opacity=".85"/>
    <text id="t_soc" x="55" y="33" text-anchor="middle" font-size="16" font-weight="800">-</text>
    <text id="t_bat" x="55" y="55" text-anchor="middle" font-size="12">-</text></g>
  <text id="t_mode" x="560" y="300" font-size="18" font-weight="800">-</text>
</svg>
<div class="why" id="why">-</div>
<svg id="chart" viewBox="0 0 900 230" width="100%" style="margin-top:10px"></svg>
<div class="lab">Línies: <span style="color:#f97316">■ preu</span> · <span style="color:#a78bfa">■ CO₂</span> (normalitzats) ·
 <span style="color:var(--bat)">■ càrrega</span> / <span style="color:#f472b6">■ descàrrega</span> · <span style="color:#e2e8f0">— bateria (%)</span></div>
<script>
const D = __DADES__;
const N = D.ts.length, $ = id => document.getElementById(id);
let i = 0, timer = null, dash = 0;
$("slider").max = N - 1;
const co2Col = c => { const t = Math.max(0, Math.min(1, (c - 0.03) / 0.15)); return `hsl(${120 - 120 * t},80%,55%)`; };
const fmt = (x, d=0) => x.toLocaleString("ca-ES", {maximumFractionDigits: d, minimumFractionDigits: d});
function setFlow(id, kw, color, reverse) {
  const e = $(id), w = kw < 1 ? 0 : 2 + 14 * Math.min(1, kw / 1500);
  e.setAttribute("stroke", color); e.setAttribute("stroke-width", w);
  e.setAttribute("stroke-dasharray", "14 10"); e.style.opacity = kw < 1 ? 0.1 : 1;
  e.dataset.dir = reverse ? -1 : 1; e.dataset.kw = kw;
}
function draw() {
  const k = i;
  $("k_ts").textContent = D.ts[k]; $("k_preu").textContent = fmt(D.preu[k], 3) + " €/kWh";
  $("k_co2").textContent = fmt(D.co2[k], 3) + " kg/kWh"; $("k_co2").style.color = co2Col(D.co2[k]);
  $("k_sco2").textContent = fmt(D.sco2[k]) + " kg"; $("k_seur").textContent = fmt(D.seur[k]) + " €";
  const b = D.bat[k];
  setFlow("f_grid", D.grid[k], co2Col(D.co2[k]), false);
  setFlow("f_sol", D.pv[k], "var(--sol)", false);
  setFlow("f_bat", Math.abs(b), b > 0 ? "var(--bat)" : "#f472b6", b < 0);
  setFlow("f_cam", D.load[k], "var(--cam)", false);
  $("n_grid").setAttribute("stroke", co2Col(D.co2[k]));
  $("t_grid").textContent = fmt(D.grid[k]) + " kW"; $("t_sol").textContent = fmt(D.pv[k]) + " kW";
  $("t_cam").textContent = fmt(D.load[k]) + " kW";
  $("t_soc").textContent = fmt(100 * D.soc[k]) + " %"; $("bat_fill").setAttribute("width", 100 * D.soc[k]);
  $("t_bat").textContent = (b > 1 ? "+" : "") + fmt(b) + " kW";
  const mode = b > 1 ? ["CARREGANT ⚡", "var(--bat)"] : b < -1 ? ["DESCARREGANT 🔋", "#f472b6"] : ["EN REPÒS", "#94a3b8"];
  $("t_mode").textContent = mode[0]; $("t_mode").style.fill = mode[1];
  $("why").innerHTML = D.why[k]; $("why").style.borderLeftColor = mode[1];
  $("slider").value = k; $("pos").textContent = `hora ${k + 1} de ${N}`;
  drawChart(k);
}
function drawChart(k) {
  const W = 900, H = 230, P = 30, win = Math.min(N, 168);
  const s = Math.max(0, Math.min(N - win, k - Math.floor(win / 2))), e = s + win;
  const x = j => P + (W - 2 * P) * (j - s) / (win - 1);
  const norm = (arr) => { const v = arr.slice(s, e), mn = Math.min(...v), mx = Math.max(...v); return j => H - P - (H - 2 * P) * (arr[j] - mn) / ((mx - mn) || 1); };
  const yp = norm(D.preu), yc = norm(D.co2), ys = j => H - P - (H - 2 * P) * D.soc[j];
  const line = (f, col, wd) => { let d = ""; for (let j = s; j < e; j++) d += (j === s ? "M" : "L") + x(j).toFixed(1) + "," + f(j).toFixed(1); return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${wd}"/>`; };
  let bars = "", mid = H / 2, bw = Math.max(1, (W - 2 * P) / win - 1);
  for (let j = s; j < e; j++) { const h = 45 * Math.abs(D.bat[j]) / D.pmax; if (h < 0.5) continue;
    bars += `<rect x="${x(j) - bw / 2}" y="${D.bat[j] > 0 ? mid - h : mid}" width="${bw}" height="${h}" fill="${D.bat[j] > 0 ? "#2dd4bf" : "#f472b6"}" opacity=".7"/>`; }
  let days = ""; for (let j = s; j < e; j++) if (D.h[j] === 0) days += `<line x1="${x(j)}" x2="${x(j)}" y1="${P}" y2="${H - P}" stroke="#334155" stroke-dasharray="3 4"/><text x="${x(j) + 3}" y="${P - 8}" font-size="11" fill="#94a3b8">${D.ts[j].slice(0, 5)}</text>`;
  $("chart").innerHTML = `<rect width="${W}" height="${H}" fill="#0b1325" rx="10"/>${days}${bars}` +
    line(yp, "#f97316", 2) + line(yc, "#a78bfa", 2) + line(ys, "#e2e8f0", 2.5) +
    `<line x1="${x(k)}" x2="${x(k)}" y1="${P - 4}" y2="${H - P + 4}" stroke="#facc15" stroke-width="2"/>`;
}
function tick() { if (i < N - 1) { i++; draw(); } else stop(); }
function stop() { clearInterval(timer); timer = null; $("play").textContent = "▶ Play"; }
$("play").onclick = () => { if (timer) return stop(); timer = setInterval(tick, +$("vel").value); $("play").textContent = "⏸ Pausa"; };
$("vel").onchange = () => { if (timer) { stop(); $("play").click(); } };
$("slider").oninput = ev => { i = +ev.target.value; draw(); };
(function anim() { dash -= 1.5; for (const id of ["f_grid", "f_sol", "f_bat", "f_cam"]) { const e = $(id);
   e.style.strokeDashoffset = dash * (+e.dataset.dir || 1) * (0.4 + Math.min(1, (+e.dataset.kw || 0) / 800)); }
   requestAnimationFrame(anim); })();
draw();
</script>
</div>
